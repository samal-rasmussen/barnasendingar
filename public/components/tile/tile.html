<style>
	/*
	 * The tile is 345px wide. The grid's columns in grid.html are this width
	 * plus the space between tiles, so change both together.
	 */
	.tile {
		position: relative;
		display: block;
		box-sizing: border-box;
		width: 345px;
		margin: 0;
		padding: 0;
		border: 1px solid transparent;
		border-radius: 8px;
		font: inherit;
		color: inherit;
		text-align: left;
		background: transparent;
		cursor: pointer;
	}

	.tile:hover {
		border-color: #8ea0ff;
	}

	.tile:focus {
		outline: 4px auto -webkit-focus-ring-color;
	}

	/*
	 * The flex container is a span inside the button, because old browsers
	 * don't lay out a <button> itself as a flex container.
	 */
	.tile-body {
		display: flex;
		flex-direction: column;
	}

	.tile-title {
		display: block;
		margin-bottom: 8px;
		overflow: hidden;
		font-size: 1.5em;
		font-weight: bold;
		white-space: nowrap;
		text-overflow: ellipsis;
	}

	.tile-image {
		display: block;
		width: 100%;
	}

	.tile-watched {
		position: absolute;
		right: 1rem;
		bottom: 1rem;
		padding: 6px 3px 3px 3px;
		font-size: 2rem;
		line-height: 1;
		background: rgba(0, 0, 0, 0.5);
	}

	@media screen and (max-width: 785px) {
		.tile {
			width: 100%;
		}

		.tile-body {
			flex-direction: row;
			justify-content: space-between;
			align-items: center;
		}

		.tile-title {
			flex: 1;
			padding-right: 2em;
			font-size: 1.3em;
			white-space: normal;
			text-align: center;
		}

		.tile-image {
			width: 50%;
		}
	}

	@media screen and (max-width: 520px) {
		.tile-title {
			font-size: 1.1em;
		}
	}

	@media screen and (max-width: 420px) {
		.tile-title {
			font-size: 1em;
		}
	}
</style>

<template id="tile">
	<button type="button" class="tile">
		<span class="tile-body">
			<span class="tile-title" data-ref="title"></span>
			<img class="tile-image" alt="" data-ref="image" />
		</span>
		<span class="tile-watched" data-ref="watched">Sæð</span>
	</button>
</template>
