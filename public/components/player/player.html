<style>
	.player {
		position: relative;
		flex: 1;
		width: 100%;
		min-height: 0;
		background: #000000;
	}

	.player-video {
		display: block;
		width: 100%;
		height: 100%;
		background: #000000;
	}

	.player-message {
		box-sizing: border-box;
		padding: 2rem;
		text-align: center;
	}
</style>

<template id="player">
	<div class="player">
		<video
			class="player-video"
			data-ref="video"
			controls
			autoplay
			preload="metadata"
			playsinline
			webkit-playsinline
		></video>
		<div class="player-message" data-ref="message" hidden></div>
	</div>
</template>
