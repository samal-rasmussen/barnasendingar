<template id="show-page">
	<h1 data-ref="title"></h1>
	<div class="grid episode-grid" data-ref="grid">
		<div class="actions">
			<button class="icon" data-ref="back">⇦</button>
			<button data-ref="clear">Nulstilla "Sæð"</button>
		</div>
	</div>
</template>

<template id="show-episode-tile">
	<div class="grid-item">
		<div class="grid-container" data-ref="tile">
			<div class="header">
				<h2 data-ref="title"></h2>
			</div>
			<img data-ref="image" alt="Partur" />
			<div class="watched" data-ref="watched">Sæð</div>
		</div>
	</div>
</template>
