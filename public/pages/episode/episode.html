<style>
	.episode {
		display: flex;
		flex-direction: column;
		width: 100%;
		height: 100vh;
		background: #000000;
		color: #ffffff;
	}

	.episode-header {
		display: flex;
		align-items: center;
		box-sizing: border-box;
		width: 100%;
		padding: 0.75rem 1rem;
		background: #181818;
	}

	.episode-header button {
		margin-right: 1rem;
	}

	.episode-heading {
		min-width: 0;
		flex: 1;
		margin-right: 1rem;
	}

	.episode-heading h1 {
		font-size: 1.4rem;
		line-height: 1.2;
		margin: 0;
		padding: 0;
		text-align: left;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.episode-heading p {
		margin: 0.2rem 0 0 0;
		color: rgba(255, 255, 255, 0.72);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.player-wrap {
		position: relative;
		flex: 1;
		width: 100%;
		min-height: 0;
		background: #000000;
	}

	.player-video {
		display: block;
		width: 100%;
		height: 100%;
		background: #000000;
	}

	.player-message {
		box-sizing: border-box;
		padding: 2rem;
		text-align: center;
	}

	@media screen and (max-width: 785px) {
		.episode-heading h1 {
			font-size: 1.1rem;
		}

		.episode-heading p {
			font-size: 0.9rem;
		}
	}
</style>

<template id="episode-page">
	<div class="episode">
		<div class="episode-header" data-ref="header">
			<button
				type="button"
				class="button button-icon"
				data-ref="back"
				aria-label="Aftur"
				title="Aftur"
			>
				<svg class="icon" aria-hidden="true" focusable="false">
					<use xlink:href="#icon-back"></use>
				</svg>
			</button>
			<div class="episode-heading">
				<h1 data-ref="showTitle"></h1>
				<p data-ref="episodeTitle"></p>
			</div>
			<button
				type="button"
				class="button button-icon"
				data-ref="fullscreen"
				aria-label="Fullur skíggi"
				title="Fullur skíggi"
			>
				<svg class="icon" aria-hidden="true" focusable="false">
					<use xlink:href="#icon-fullscreen"></use>
				</svg>
			</button>
		</div>
		<div class="player-wrap" data-ref="playerWrap">
			<video
				class="player-video"
				data-ref="video"
				controls
				autoplay
				preload="metadata"
				playsinline
				webkit-playsinline
			></video>
		</div>
	</div>
</template>

<template id="episode-player-message">
	<div class="player-message"></div>
</template>
