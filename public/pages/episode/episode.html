<style>
	/*
	 * The page fills the screen exactly and never scrolls: the header has a
	 * fixed height (it is always one row; long titles are cut off), and the
	 * player fills the rest. Absolute positioning, not flexbox, because
	 * Chrome 38 can't resolve the video's height: 100% inside a flex item.
	 */
	.episode {
		position: fixed;
		top: 0;
		right: 0;
		bottom: 0;
		left: 0;
		background: #000000;
		color: #ffffff;
	}

	.episode-header {
		display: flex;
		align-items: center;
		box-sizing: border-box;
		height: 4.875rem;
		padding: 0.75rem 1rem;
		background: #181818;
	}

	.episode-player {
		position: absolute;
		top: 4.875rem;
		right: 0;
		bottom: 0;
		left: 0;
	}

	.episode-header button {
		margin-right: 1rem;
	}

	.episode-heading {
		min-width: 0;
		flex: 1;
		margin-right: 1rem;
	}

	.episode-heading h1 {
		font-size: 1.4rem;
		line-height: 1.2;
		margin: 0;
		padding: 0;
		text-align: left;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.episode-heading p {
		margin: 0.2rem 0 0 0;
		color: rgba(255, 255, 255, 0.72);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	@media screen and (max-width: 785px) {
		.episode-header {
			height: 4.5rem;
		}

		.episode-player {
			top: 4.5rem;
		}

		.episode-heading h1 {
			font-size: 1.1rem;
		}

		.episode-heading p {
			font-size: 0.9rem;
		}
	}
</style>

<template id="episode-page">
	<div class="episode">
		<div class="episode-header">
			<button
				type="button"
				class="button button-icon"
				data-ref="back"
				aria-label="Aftur"
				title="Aftur"
			>
				<svg class="icon" aria-hidden="true" focusable="false">
					<use xlink:href="#icon-back"></use>
				</svg>
			</button>
			<div class="episode-heading">
				<h1 data-ref="showTitle"></h1>
				<p data-ref="episodeTitle"></p>
			</div>
			<button
				type="button"
				class="button button-icon"
				data-ref="fullscreen"
				aria-label="Fullur skíggi"
				title="Fullur skíggi"
			>
				<svg class="icon" aria-hidden="true" focusable="false">
					<use xlink:href="#icon-fullscreen"></use>
				</svg>
			</button>
			<div data-ref="quality"></div>
		</div>
		<div class="episode-player">
			<div data-ref="player"></div>
		</div>
	</div>
</template>
