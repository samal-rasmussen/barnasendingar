<style>
	.episode {
		display: flex;
		flex-direction: column;
		width: 100%;
		height: 100vh;
		background: #000000;
		color: #ffffff;
	}

	.episode-header {
		display: flex;
		align-items: center;
		box-sizing: border-box;
		width: 100%;
		padding: 0.75rem 1rem;
		background: #181818;
	}

	.episode-header button {
		margin-right: 1rem;
	}

	.episode-heading {
		min-width: 0;
		flex: 1;
		margin-right: 1rem;
	}

	.episode-heading h1 {
		font-size: 1.4rem;
		line-height: 1.2;
		margin: 0;
		padding: 0;
		text-align: left;
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.episode-heading p {
		margin: 0.2rem 0 0 0;
		color: rgba(255, 255, 255, 0.72);
		white-space: nowrap;
		overflow: hidden;
		text-overflow: ellipsis;
	}

	.player-wrap {
		position: relative;
		flex: 1;
		width: 100%;
		min-height: 0;
		background: #000000;
	}

	.player-video {
		display: block;
		width: 100%;
		height: 100%;
		background: #000000;
	}

	.fullscreen-button {
		padding-right: 0.5rem;
	}

	.fullscreen-icon {
		display: block;
		width: 1em;
		height: 1em;
	}

	.player-message {
		box-sizing: border-box;
		padding: 2rem;
		text-align: center;
	}

	@media screen and (max-width: 785px) {
		.episode-heading h1 {
			font-size: 1.1rem;
		}

		.episode-heading p {
			font-size: 0.9rem;
		}
	}
</style>

<template id="episode-page">
	<div class="episode">
		<div class="episode-header" data-ref="header">
			<button class="icon" data-ref="back">⇦</button>
			<div class="episode-heading">
				<h1 data-ref="showTitle"></h1>
				<p data-ref="episodeTitle"></p>
			</div>
			<button
				class="icon fullscreen-button"
				data-ref="fullscreen"
				title="Fullur skíggi"
				aria-label="Fullur skíggi"
			>
				<svg class="fullscreen-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
					<path
						d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"
						fill="none"
						stroke="currentColor"
						stroke-width="2.5"
						stroke-linecap="round"
						stroke-linejoin="round"
					/>
				</svg>
			</button>
		</div>
		<div class="player-wrap" data-ref="playerWrap">
			<video
				class="player-video"
				data-ref="video"
				controls
				autoplay
				preload="metadata"
				playsinline
				webkit-playsinline
			></video>
		</div>
	</div>
</template>

<template id="episode-player-message">
	<div class="player-message"></div>
</template>
